<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181920" />
      <stop offset="100%" stop-color="#0c0d11" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a3f55" />
      <stop offset="100%" stop-color="#1e202a" />
    </linearGradient>

    <!-- Cyan Glow & Accent -->
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d" />
      <stop offset="50%" stop-color="#11998e" />
      <stop offset="100%" stop-color="#00d2ff" />
    </linearGradient>

    <linearGradient id="orbit-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#4facfe" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#7000ff" stop-opacity="0.8" />
    </linearGradient>

    <!-- Warm Amber (Beacon / Human validation) -->
    <linearGradient id="amber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd200" />
      <stop offset="100%" stop-color="#f7971e" />
    </linearGradient>

    <!-- Filters -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- App Squircle Shell -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg-grad)" stroke="url(#border-grad)" stroke-width="3" />

  <!-- Radial ambient light in center -->
  <circle cx="256" cy="256" r="160" fill="#00d2ff" opacity="0.06" filter="url(#glow)" />
  <circle cx="256" cy="180" r="100" fill="#f7971e" opacity="0.05" filter="url(#glow)" />

  <!-- Background Radar / Orbit Rings -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#252a38" stroke-width="1.5" stroke-dasharray="6 8" />
  <circle cx="256" cy="256" r="95" fill="none" stroke="#2a3042" stroke-width="1.5" />

  <!-- Dynamic Orbit Arc (Orchestration Cycle) -->
  <path d="M 140 330 A 150 150 0 1 1 380 320" fill="none" stroke="url(#orbit-grad)" stroke-width="4.5" stroke-linecap="round" filter="url(#subtle-glow)" />

  <!-- DAG Flow Edges (Edges between Nodes) -->
  <!-- Bottom Left Node (160, 310) to Center Pulse Node (256, 256) -->
  <line x1="160" y1="310" x2="256" y2="256" stroke="#3b445c" stroke-width="3.5" stroke-linecap="round" />
  <line x1="160" y1="310" x2="256" y2="256" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" opacity="0.8" />

  <!-- Bottom Right Node (352, 310) to Center Pulse Node (256, 256) -->
  <line x1="352" y1="310" x2="256" y2="256" stroke="#3b445c" stroke-width="3.5" stroke-linecap="round" />
  <line x1="352" y1="310" x2="256" y2="256" stroke="#4facfe" stroke-width="2" stroke-linecap="round" opacity="0.8" />

  <!-- Center Pulse to Apex Beacon (256, 150) (Governance / Validation) -->
  <line x1="256" y1="256" x2="256" y2="150" stroke="#f7971e" stroke-width="3" stroke-dasharray="4 6" stroke-linecap="round" opacity="0.7" />

  <!-- Pulse Frequency Wave cutting horizontally through center -->
  <path d="M 190 256 L 225 256 L 240 230 L 256 282 L 272 240 L 285 256 L 322 256" fill="none" stroke="#00f2fe" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- DAG Nodes -->
  <!-- Node 1: Left Worker -->
  <circle cx="160" cy="310" r="16" fill="#141722" stroke="#00f2fe" stroke-width="3.5" filter="url(#subtle-glow)" />
  <circle cx="160" cy="310" r="6" fill="#00f2fe" />

  <!-- Node 2: Right Worker -->
  <circle cx="352" cy="310" r="16" fill="#141722" stroke="#4facfe" stroke-width="3.5" filter="url(#subtle-glow)" />
  <circle cx="352" cy="310" r="6" fill="#4facfe" />

  <!-- Node 3: Center Pulse Core (The Engine) -->
  <circle cx="256" cy="256" r="22" fill="#10131d" stroke="#00f2fe" stroke-width="2.5" opacity="0.4" />

  <!-- Apex Beacon: Human Governance ("À traiter" / Validation Gate) -->
  <polygon points="256,128 274,158 238,158" fill="url(#amber-grad)" filter="url(#glow)" />
  <circle cx="256" cy="150" r="4" fill="#ffffff" />
</svg>